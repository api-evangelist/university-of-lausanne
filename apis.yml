x-coverage:
  state: covered
  reason: covered
  detail: >-
    UNIL operates three anonymously callable surfaces on its own registrable
    domain and all three are contracted here: the SPICA atlas API
    (spica.unil.ch), the IRIS DSpace-CRIS REST API and its two OAI-PMH contexts
    (api.unil.ch/iris/server). Its own Shibboleth IdP is registered in SWITCHaai
    and exported to eduGAIN, and it holds a DataCite repository registration
    under DOI prefix 10.48657. What UNIL does NOT publish is equally settled and
    was probed rather than assumed: no developer portal (developer.unil.ch and
    developers.unil.ch do not resolve), no open-data portal (data.unil.ch and
    opendata.unil.ch do not resolve), no llms.txt, no OpenAPI of its own, no
    MCP server, and no machine-readable course catalog — the public course
    catalogue at applicationspub.unil.ch is HTML with no JSON or XML export.
    The Kong gateway at api.unil.ch routes only /iris/server; every other prefix
    probed returned the gateway's own 404. The previous institutional repository
    at serval.unil.ch is correctly retired with a hard HTTP 410 and must not be
    re-listed. Student information, timetables and registration sit behind
    my.unil.ch SSO and are not documented as APIs. No vendor contract was found
    attributed to UNIL, and none was saved.
  evidence:
