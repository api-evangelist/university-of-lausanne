- aid: university-of-lausanne:unil-shibboleth-idp
  name: UNIL Shibboleth Identity Provider (SAML 2.0 metadata)
  x-operator: federation
  description: >-
    UNIL's own Shibboleth identity provider, entityID
    https://aai.unil.ch/idp/shibboleth, carrying an IDPSSODescriptor with
    OrganizationName "unil.ch", OrganizationDisplayName "Université de Lausanne"
    and a shibmd:Scope of unil.ch. Registered in the SWITCHaai federation and
    exported to eduGAIN (confirmed present in mds.edugain.org/edugain-v2.xml on
    2026-09-01). 145 distinct unil.ch entityIDs are registered in the same
    aggregate, including a second SAML entity at
    http://sts.unil.ch/adfs/services/trust and a Keycloak realm at
    bix.unil.ch/keycloak/realms/edu_id. Recorded as federation rather than
    discarded as a shared host: the entityID, the scope, the organisation and
    the identities are UNIL's, while the SSO endpoints run on SWITCH's edu-ID
    platform at unil.login.eduid.ch. Note that aai.unil.ch has no public A
    record — the entityID is a URI, not a fetchable host — and SWITCH runs no
    per-entity MDQ service, so the metadata is readable only from the published
    aggregates. This is not a developer API and there is no client registration.
  humanURL: https://www.unil.ch/ci/fr/home/menuinst/catalogue-de-services/authentification-et-comptes/authentification-aai.html
  baseURL: https://metadata.aai.switch.ch/metadata.switchaai+idp.xml
