description: >-
  The University of Lausanne (UNIL) is a public research university in Lausanne,
  Switzerland, founded in 1537, with roughly 17,000 students across seven faculties
  and ROR identifier https://ror.org/019whta54. UNIL publishes no developer portal,
  no API key programme, no API terms and no changelog, and no central catalogue of
  its own interfaces exists — but unlike most of this cohort its small programmable
  footprint is genuinely its own rather than a vendor's contract wearing its name.
  Three surfaces answer anonymously on UNIL's own registrable domain: the SPICA
  single-cell / spatial atlas JSON API at spica.unil.ch; the IRIS institutional
  research repository's DSpace-CRIS REST API at api.unil.ch/iris/server/api, behind
  a Kong gateway, with 253,799 indexed objects reachable through Discovery search
  while /core/items and /core/bitstreams answer 401; and two anonymous OAI-PMH 2.0
  harvesting contexts on the same host, one of them declaring OpenAIRE Guidelines
  for CRIS Managers v1.1. Beyond the contracts, UNIL operates its own Shibboleth
  identity provider (entityID https://aai.unil.ch/idp/shibboleth, scope unil.ch)
  registered in SWITCHaai and exported to eduGAIN, and holds a DataCite repository
  registration minting DOIs under prefix 10.48657. Everything else — student
  information, timetables, course registration — sits behind the my.unil.ch SSO
  gateway and is not documented as an API anywhere. No OpenAPI, AsyncAPI or MCP
  server is published by UNIL itself; every contract in this repository was written
  by API Evangelist from live probes and is marked as such.
