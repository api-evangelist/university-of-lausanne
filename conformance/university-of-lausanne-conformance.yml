- id: orcid
  conforms: false
  note: >-
    The IRIS DSpace-CRIS root document exposes 92 HAL link relations, none of
    them an ORCID endpoint, and no anonymously reachable UNIL surface returns
    ORCID iDs as a first-class contract. Left false rather than assumed.
- id: crossref
  conforms: false
  note: >-
    api.crossref.org/members?query=Lausanne returns no University of Lausanne
    member (the only Lausanne hit is an EPFL laboratory, member 52983). UNIL
    registers DOIs through DataCite, not Crossref.
